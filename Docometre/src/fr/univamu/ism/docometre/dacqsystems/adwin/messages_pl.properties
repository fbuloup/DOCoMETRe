DeleteVariablesOperation_Label = Usu\u0144 zmienn\u0105(-e)
AddVariableOperation_Label = Dodaj zmienn\u0105
VariablesExplanations_Text = <form>\
								<p>Zmienne to obszary pami\u0119ci w urz\u0105dzeniu ADWin, kt\u00f3rych mo\u017cesz u\u017cywa\u0107 do tworzenia algorytm\u00f3w w procesach.<br/>Opr\u00f3cz nazwy i cz\u0119stotliwo\u015bci pr\u00f3bkowania (<b>Cz.P.</b>), oto obja\u015bnienia pozosta\u0142ych parametr\u00f3w do skonfigurowania :</p>\
								<li><b>Transfer</b> : je\u015bli prawda, b\u0119dzie mo\u017cna przesy\u0142a\u0107 warto\u015bci zmiennej z urz\u0105dzenia ADwin do komputera.</li>\
								<li><b>Transfer automatyczny</b> : je\u015bli prawda, kod transferu ADBasic zostanie wygenerowany automatycznie. Je\u015bli fa\u0142sz, umie\u015b\u0107 w razie potrzeby akcj\u0119 transferu w procesach.<br/>U\u017cywane tylko, gdy <b>Transfer</b> jest prawd\u0105.</li>\
								<li><b>Numer transferu</b> : ten numer jest unikalny i jest u\u017cywany do transferu. U\u017cywany tylko, gdy <b>Transfer</b> jest prawd\u0105.<br/>Numer jest generowany automatycznie. Nie mo\u017cna go zmieni\u0107.</li>\
								<li><b>Rejestracja</b> : je\u015bli prawda, warto\u015bci kana\u0142u b\u0119d\u0105 zapisywane w pliku binarnym. U\u017cywane tylko, gdy <b>Transfer</b> jest prawd\u0105.</li>\
								<li><b>Rozmiar bufora</b> : poniewa\u017c urz\u0105dzenie ADWin mo\u017ce przetwarza\u0107 dane z du\u017c\u0105 cz\u0119stotliwo\u015bci\u0105, warto\u015bci zmiennych s\u0105 buforowane : podaj tutaj rozmiar bufora.<br/>U\u017cywane tylko, gdy <b>Transfer</b> jest prawd\u0105.</li>\
								<li><b>Typ</b> : zmienna mo\u017ce by\u0107 liczb\u0105 ca\u0142kowit\u0105 lub zmiennoprzecinkow\u0105.</li>\
								<li><b>Rozmiar</b> : zmienna mo\u017ce by\u0107 skalarem lub tablic\u0105. Je\u015bli wprowadzono "1", zmienna b\u0119dzie skalarem, w przeciwnym razie b\u0119dzie tablic\u0105.</li>\
								<li><b>Parametr</b> : zmienna mo\u017ce by\u0107 parametrem. W takim przypadku nie mo\u017cna jej u\u017cywa\u0107 jako tablicy.<br/>Parametry mog\u0105 s\u0142u\u017cy\u0107 do budowania modu\u0142owych proces\u00f3w. Transferowanie parametru nie ma sensu, ale mo\u017ce on by\u0107 propagowany.</li>\
								<li><b>Propagacja</b> : czy ten parametr b\u0119dzie propagowany mi\u0119dzy pr\u00f3bami.<br/>U\u017cywane tylko, gdy <b>Parametr</b> jest prawd\u0105.</li>\
							</form>

########### CAN module page
ADWinCANPage_PageTitle = Konfiguracja CAN
ADWinCANModuleExplanations_Text =  <form>\
								<p>Aby u\u017cywa\u0107 tego modu\u0142u przy pr\u0119dko\u015bci transmisji wi\u0119kszej ni\u017c 125000 bit\u00f3w/s, musi to by\u0107 modu\u0142 High Speed CAN.<br/>Aby modu\u0142 dzia\u0142a\u0142 prawid\u0142owo, globalna cz\u0119stotliwo\u015b\u0107 pr\u00f3bkowania musi wynosi\u0107 co najmniej 15kHz.<br/>Ponadto, je\u015bli u\u017cywasz wi\u0119cej ni\u017c jednego modu\u0142u o tym samym numerze, wybierz r\u00f3\u017cne numery interfejs\u00f3w.</p>\
								<p>Obecnie obs\u0142ugiwane s\u0105 tylko systemy "CADAMOTION, OPTITRACK, GYROSCOPE i TIMESTAMP".<br/>Dla tych system\u00f3w pr\u0119dko\u015b\u0107 transmisji zostanie wymuszona na 1000000 bit\u00f3w/s.<br/></p>\
								<p>Je\u015bli wybierzesz system "NOT SPECIFIED", to Ty odpowiadasz za dodanie odpowiedniego kodu ADBasic w procesach.<br/></p>\
								<p><br/></p>\
							</form>
