AnInModuleExplanations_Text2 =  <form>\
								<p>Ta tabela pokazuje parametry ka\u017cdego kana\u0142u tego modu\u0142u wej\u015b\u0107 analogowych.<br/>Informacje o niekt\u00f3rych z tych parametr\u00f3w znajdziesz na stronie zmiennych.<br/>Pozosta\u0142e obja\u015bniono poni\u017cej :</p>\
								<li><b>Numer kana\u0142u</b> : numer wej\u015bcia spo\u015br\u00f3d wszystkich dost\u0119pnych wej\u015b\u0107.</li>\
								<li><b>Wzmocnienie</b> : sygna\u0142 analogowy pod\u0142\u0105czony do tego wej\u015bcia mo\u017ce zosta\u0107 wzmocniony przed akwizycj\u0105. Wzmocnienie mo\u017ce wynosi\u0107 2, 4 lub 8.</li>\
								<li><b>Jednostka</b> : jednostka fizyczna zwi\u0105zana z czujnikiem. Przydatna podczas kalibracji.</li>\
								<li><b>Warto\u015b\u0107 UMaks</b> : warto\u015b\u0107 maksymalna w jednostce "fizycznej" (kalibracja).</li>\
								<li><b>Warto\u015b\u0107 UMin</b> : warto\u015b\u0107 minimalna w jednostce "fizycznej" (kalibracja).</li>\
								<li><b>Warto\u015b\u0107 AMaks</b> : warto\u015b\u0107 maksymalna w jednostce "elektrycznej" (kalibracja).</li>\
								<li><b>Warto\u015b\u0107 AMin</b> : warto\u015b\u0107 minimalna w jednostce "elektrycznej" (kalibracja).</li>\
							</form>
