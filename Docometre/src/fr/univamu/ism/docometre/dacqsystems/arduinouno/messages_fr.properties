AnalogReference_Label = Référence analogique : 
AnalogReference_Tooltip = Référence analogique
AnInModuleExplanations_Text = <form>\
								<p>D'après la documentation officielle de l'Arduino Uno, la "référence analogique" configure la tension de référence utilisée pour les entrées analogiques (c'est-à-dire la valeur utilisée comme limite haute de la plage d'entrée). Les options sont :</p>\
								<li><b>DEFAULT</b> : la référence analogique par défaut de 5 volts (cartes Arduino 5V) ou de 3,3 volts (cartes Arduino 3,3V).</li>\
								<li><b>INTERNAL</b> : une référence interne, égale à 1,1 volt sur les ATmega168 ou ATmega328P et à 2,56 volts sur l'ATmega8.</li>\
								<li><b>EXTERNAL</b> : la tension appliquée sur la broche AREF (de 0 à 5V uniquement) est utilisée comme référence (Arduino Uno R3).</li>\
								<li><b>AR_DEFAULT</b> : la référence analogique par défaut de 5 volts (Arduino Uno R4).</li>\
								<li><b>AR_INTERNAL</b> : une référence interne, égale à 1,5 volt sur le RA4M1 de l'Arduino Uno R4.</li>\
								<li><b>AR_EXTERNAL</b> : la tension appliquée sur la broche AREF (de 0 à 5V uniquement) est utilisée comme référence (Arduino Uno R4).</li>\
							</form>
AnInModuleExplanations_Text2 = <form>\
								<p>Ce tableau présente les paramètres de chaque canal de ce module d'entrées analogiques.<br/>Voir la page Variables pour obtenir des informations sur certains de ces paramètres.<br/>Les autres sont expliqués ci-dessous :</p>\
								<li><b>Unité</b> : l'unité physique du capteur. Utile lors de la calibration.</li>\
								<li><b>Valeur UMax</b> : la valeur maximale en unité "physique" (calibration).</li>\
								<li><b>Valeur UMin</b> : la valeur minimale en unité "physique" (calibration).</li>\
								<li><b>Valeur AMax</b> : la valeur maximale en unité "électrique" (calibration).</li>\
								<li><b>Valeur AMin</b> : la valeur minimale en unité "électrique" (calibration).</li>\
							</form>
Unit_Label = Unité
Unit_Tooltip = L'unité physique du capteur
