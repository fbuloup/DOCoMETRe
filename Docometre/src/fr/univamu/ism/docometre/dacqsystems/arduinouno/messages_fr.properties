########### DIO module configuration page
DigInOutConfigurationPage_Title = Configuration du module d'entrées/sorties numériques
DigInOutExplanationsSection_Title = Introduction
DigInOutExplanationsSection_Description = Vous trouverez ci-dessous quelques explications sur les entrées/sorties numériques.
DigInOutModuleExplanations_Text = <form>\
								<p>Les sorties numériques peuvent être utilisées pour piloter des LEDs, des buzzers, etc., c'est-à-dire tout dispositif électronique ayant deux états ON ou OFF.<br/>Les entrées numériques peuvent être utilisées pour surveiller tout dispositif électronique ne délivrant que deux états : boutons, interrupteurs, etc.</p>\
							</form>
DigInOutModuleExplanations_Text2 = <form>\
								<p>Ce tableau présente les paramètres de chaque canal de ce module d'entrées/sorties numériques.<br/>Voir la page Variables pour obtenir des informations sur certains de ces paramètres.<br/>Les autres sont expliqués ci-dessous :</p>\
								<li><b>Numéro de canal</b> : numéro de l'entrée ou de la sortie parmi toutes les entrées/sorties disponibles.</li>\
								<li><b>Entrée/Sortie</b> : permet de définir ce canal comme entrée ou comme sortie.</li>\
								<li><b>Stimulus</b> : si les valeurs de sortie sont prédéfinies, utilisez ce canal comme stimulus et l'éditeur de stimulus pour créer ces valeurs.<br/>Utilisé uniquement lorsque le canal est défini comme sortie numérique.</li>\
							</form>
							
########### AD1115 properties
ADS1115Page_PageTitle = Configuration du Module ADS1115 (4 entrées analogiques 15bits)
address_label = Adresse :
address_tooltip = Adresse du module sur le bus I2C
mode_tooltip = 0 : mode continu\n1 : mode conversion à la demande
mode_label = Mode :
dataRate_tooltip = De #124ms (0) à #2.7ms (7)\nPlus lent, c'est moins bruyant
dataRate_label = Temps de conversion :
ADS1115ModuleExplanations_Text =  <form>\
								<p>Le module ADS1115 est un CAN &#916;&#931; I2C 16bits 4 canaux multiplexés. Le résultat sur 16 bits est signé : avec des entrées non différentielles (tension mesurée par rapport à GND), seules les valeurs positives sont utilisées, soit 15 bits utiles (0 à 32767). Vous pouvez avoir jusqu'à quatre modules ADS1115 sur un Arduino Uno.<br/>\
								Chaque module doit avoir une adresse I2C distincte (0x48, 0x49, 0x4A ou 0x4B). Le paramètre "mode" peut valoir 0 pour le mode continu ou 1 pour le mode à la demande.<br/>\
								Le mode continu peut être utilisé lorsque uniquement un canal est acquis (&#8776;600Hz max.). Le mode à la demande est préférable pour l'acquisition de plusieurs canaux (&#8776;300Hz max. pour un canal).<br/>\
								Le paramètre "temps de conversion" peut prendre une valeur entière entre 0 et 7. 0 correspond à un temps de conversion d'environ 124ms et 7 d'environ 2.7ms.<br/>\
								Il est recommandé de fixer cette valeur à 7, sauf si vous constatez une présence de bruit trop important. Voir l'aide pour plus de détails.</p>\
							</form>
ADS1115ModuleExplanations_Text2 = <form>\
								<p>Ce tableau présente les paramètres de chaque canal de ce module d'entrées analogiques ADS1115.<br/>Voir les pages Variables et module d'entrées analogiques pour obtenir des informations sur certains de ces paramètres.<br/>L'autre est expliqué ci-dessous :</p>\
								<li><b>Gain</b> : sélection du gain de l'amplificateur programmable (PGA). Une valeur parmi 0, 1, 2, 4, 8 ou 16.</li>\
								<p>0 donne un gain réel de 2/3 avec une précision de 0.1875mV dans la gamme [0-5]V sous 5VCC ou [0-3.3]V sous 3.3VCC<br/>\
								1 donne un gain réel de 1 avec une précision de 0.125mV dans la gamme [0-4.096]V sous 5VCC ou [0-3.3]V sous 3.3VCC<br/>\
								2 donne un gain réel de 2 avec une précision de 0.0625mV dans la gamme [0-2.048]V sous 5VCC ou 3.3VCC<br/>\
								4 donne un gain réel de 4 avec une précision de 0.03125mV dans la gamme [0-1.024]V sous 5VCC ou 3.3VCC<br/>\
								8 donne un gain réel de 8 avec une précision de 0.015625mV dans la gamme [0-0.512]V sous 5VCC ou 3.3VCC<br/>\
								16 donne un gain réel de 16 avec une précision de 0.0078125mV dans la gamme [0-0.256]V sous 5VCC ou 3.3VCC</p>\
							</form>
Gain_Tooltip = Gain (Voir ci-dessus)
Gain_Label = Gain

