########### Analog outputs module configuration page
ArduinoAnOutConfigurationPage_Title = Configuration des sorties analogiques
#AnOut_Stimulus_Label = Stimulus
#AnOut_Stimulus_Tooltip = Whether or not this channel is a stimulus
#DeleteOutput_Tooltip = Delete selected output(s)
#AddOutput_Tooltip = Add new analog output
AnOutModuleExplanations_Text = <form>\
								<p>L'"amplitude maximum" est la valeur maximale de la tension qui peut être traitée par le module.<br/>L'"amplitude minimum" est la valeur négative maximale de la tension qui peut être traitée par le module.<br/>Les combinaisons disponibles sont \u00b110V, \u00b15V ou 0-10V.</p>\
							</form>
AnOutModuleExplanations_Text2 = <form>\
								<p>Ce tableau présente les paramètres de chaque canal de ce module de sorties analogiques.<br/>Voir la page Variables pour obtenir des informations sur certains de ces paramètres.<br/>Les autres sont expliqués ci-dessous :</p>\
								<li><b>Numéro de canal</b> : numéro de la sortie parmi toutes les sorties disponibles.</li>\
								<li><b>Stimulus</b> : si les valeurs de sortie sont prédéfinies, utilisez ce canal comme stimulus et l'éditeur de stimulus pour créer ces valeurs.</li>\
								<li><b>AOUT_DAC</b> (Arduino Uno R4 WiFi uniquement) : vraie sortie analogique du DAC sur la broche A0, valeurs de 0 à 4095 (12 bits). Les autres sorties analogiques sont des sorties PWM, valeurs de 0 à 255. La broche A0 ne peut pas être utilisée à la fois comme entrée analogique AIN0 et comme sortie DAC.</li>\
							</form>
							
							
