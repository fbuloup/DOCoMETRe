VariablesExplanations_Text = <form>\
								<p>Les variables sont des espaces mémoire de l'Arduino Uno que vous pouvez utiliser pour développer vos algorithmes dans les processus.<br/>En plus du nom et de la fréquence d'échantillonnage (<b>F.E.</b>), voici quelques explications sur les autres paramètres à configurer :</p>\
								<li><b>Transfert</b> : si vrai, les valeurs de la variable pourront être transférées de l'Arduino Uno vers l'ordinateur hôte.</li>\
								<li><b>Enregistrement</b> : si vrai, les valeurs du canal seront sauvegardées dans un fichier binaire. Utilisé uniquement lorsque <b>Transfert</b> est vrai.</li>\
								<li><b>Type</b> : une variable peut être un entier ou un nombre à virgule flottante.</li>\
								<li><b>Taille</b> : une variable peut être un scalaire ou un tableau. Si "1" est saisi, la variable sera un scalaire, sinon ce sera un tableau.</li>\
								<li><b>Paramètre</b> : une variable peut être un paramètre : sa valeur est lue dans le fichier des paramètres pour chaque essai. Un paramètre ne peut pas être transféré. Sauf pour le type string, un paramètre ne peut pas être un tableau.</li>\
								<li><b>Propagation</b> : si ce paramètre est ou non propagé dans les essais (sa valeur à la fin d'un essai est écrite pour l'essai suivant). Utilisé uniquement lorsque <b>Paramètre</b> est vrai, pas pour le type string.</li>\
								<li>Type <b>string</b> : chaîne de caractères, <b>Taille</b> est sa longueur maximale.</li>\
							</form>
