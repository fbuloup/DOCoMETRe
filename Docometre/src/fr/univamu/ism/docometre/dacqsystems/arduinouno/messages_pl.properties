								<p>Wyj\u015bcia cyfrowe mog\u0105 sterowa\u0107 diodami LED, brz\u0119czykami itp., czyli dowolnym urz\u0105dzeniem elektronicznym maj\u0105cym stany ON lub OFF.<br/>Wej\u015bcia cyfrowe mog\u0105 monitorowa\u0107 dowolne urz\u0105dzenie elektroniczne dostarczaj\u0105ce tylko dwa stany : przyciski, prze\u0142\u0105czniki itp.</p>\
