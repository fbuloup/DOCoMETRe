VariablesExplanations_Text = <form>\
								<p>Zmienne to obszary pami\u0119ci w urz\u0105dzeniu Arduino Uno, kt\u00f3rych mo\u017cesz u\u017cywa\u0107 do tworzenia algorytm\u00f3w w procesach.<br/>Opr\u00f3cz nazwy i cz\u0119stotliwo\u015bci pr\u00f3bkowania (<b>Cz.P.</b>), oto obja\u015bnienia pozosta\u0142ych parametr\u00f3w do skonfigurowania :</p>\
								<li><b>Transfer</b> : je\u015bli prawda, b\u0119dzie mo\u017cna przesy\u0142a\u0107 warto\u015bci zmiennej z urz\u0105dzenia Arduino Uno do komputera.</li>\
								<li><b>Rejestracja</b> : je\u015bli prawda, warto\u015bci kana\u0142u b\u0119d\u0105 zapisywane w pliku binarnym. U\u017cywane tylko, gdy <b>Transfer</b> jest prawd\u0105.</li>\
								<li><b>Typ</b> : zmienna mo\u017ce by\u0107 liczb\u0105 ca\u0142kowit\u0105 lub zmiennoprzecinkow\u0105.</li>\
								<li><b>Rozmiar</b> : zmienna mo\u017ce by\u0107 skalarem lub tablic\u0105. Je\u015bli wprowadzono "1", zmienna b\u0119dzie skalarem, w przeciwnym razie b\u0119dzie tablic\u0105.</li>\
							</form>
