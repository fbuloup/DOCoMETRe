AnalogReference_Label = Napi\u0119cie odniesienia :
AnalogReference_Tooltip = Napi\u0119cie odniesienia
AnInModuleExplanations_Text =  <form>\
								<p>Zgodnie z oficjaln\u0105 dokumentacj\u0105 Arduino Uno, "napi\u0119cie odniesienia" konfiguruje napi\u0119cie referencyjne u\u017cywane dla wej\u015b\u0107 analogowych (tj. warto\u015b\u0107 u\u017cywan\u0105 jako g\u00f3rna granica zakresu wej\u015bciowego). Dost\u0119pne opcje :</p>\
								<li><b>DEFAULT</b> : domy\u015blne napi\u0119cie odniesienia 5 wolt\u00f3w (na p\u0142ytkach Arduino 5V) lub 3,3 wolta (na p\u0142ytkach Arduino 3,3V).</li>\
								<li><b>INTERNAL</b> : wbudowane napi\u0119cie odniesienia, r\u00f3wne 1,1 wolta na ATmega168 lub ATmega328P i 2,56 wolta na ATmega8.</li>\
								<li><b>EXTERNAL</b> : jako odniesienie u\u017cywane jest napi\u0119cie podane na pin AREF (tylko od 0 do 5V) (Arduino Uno R3).</li>\
								<li><b>AR_DEFAULT</b> : domy\u015blne napi\u0119cie odniesienia 5 wolt\u00f3w (Arduino Uno R4).</li>\
								<li><b>AR_EXTERNAL</b> : jako odniesienie u\u017cywane jest napi\u0119cie podane na pin AREF (tylko od 0 do 5V) (Arduino Uno R4).</li>\
							</form>
AnInModuleExplanations_Text2 =  <form>\
								<p>Ta tabela pokazuje parametry ka\u017cdego kana\u0142u tego modu\u0142u wej\u015b\u0107 analogowych.<br/>Informacje o niekt\u00f3rych z tych parametr\u00f3w znajdziesz na stronie zmiennych.<br/>Pozosta\u0142e obja\u015bniono poni\u017cej :</p>\
								<li><b>Jednostka</b> : jednostka fizyczna zwi\u0105zana z czujnikiem. Przydatna podczas kalibracji.</li>\
								<li><b>Warto\u015b\u0107 UMaks</b> : warto\u015b\u0107 maksymalna w jednostce "fizycznej" (kalibracja).</li>\
								<li><b>Warto\u015b\u0107 UMin</b> : warto\u015b\u0107 minimalna w jednostce "fizycznej" (kalibracja).</li>\
								<li><b>Warto\u015b\u0107 AMaks</b> : warto\u015b\u0107 maksymalna w jednostce "elektrycznej" (kalibracja).</li>\
								<li><b>Warto\u015b\u0107 AMin</b> : warto\u015b\u0107 minimalna w jednostce "elektrycznej" (kalibracja).</li>\
							</form>
