########### AD1115 properties
ADS1115Page_PageTitle = Modu\u0142 ADS1115 (4 wej\u015bcia analogowe 15-bitowe)
address_label = Adres :
address_tooltip = Adres modu\u0142u na magistrali I2C
mode_tooltip = 0 : tryb ci\u0105g\u0142y\n1 : tryb pojedynczego pomiaru
mode_label = Tryb :
dataRate_tooltip = Od #124ms (0) do #2.7ms (7)\nWolniej oznacza mniej szumu
dataRate_label = Czas konwersji :
ADS1115ModuleExplanations_Text =  <form>\
								<p>ADS1115 to 16-bitowy przetwornik ADC &#916;&#931; I2C z czterema multipleksowanymi kana\u0142ami. Do Arduino Uno mo\u017cna pod\u0142\u0105czy\u0107 maksymalnie cztery modu\u0142y ADS1115.<br/>\
								Ka\u017cdy modu\u0142 musi mie\u0107 w\u0142asny adres I2C (0x48, 0x49, 0x4A lub 0x4B). Parametr "tryb" mo\u017ce mie\u0107 warto\u015b\u0107 0 dla trybu ci\u0105g\u0142ego lub 1 dla trybu pojedynczego pomiaru.<br/>\
								Tryb ci\u0105g\u0142y mo\u017ce by\u0107 u\u017cywany, gdy rejestrowany jest tylko jeden kana\u0142 (&#8776;600Hz maks.). Tryb pojedynczego pomiaru jest zalecany przy akwizycji wielu kana\u0142\u00f3w (&#8776;300Hz maks. na kana\u0142).<br/>\
								Parametr "czas konwersji" mo\u017ce mie\u0107 warto\u015b\u0107 od 0 do 7. 0 daje czas konwersji oko\u0142o 124ms, a 7 oko\u0142o 2.7ms.<br/>\
								Zaleca si\u0119 ustawienie tej warto\u015bci na 7, chyba \u017ce zauwa\u017cysz zbyt du\u017cy szum. Wi\u0119cej szczeg\u00f3\u0142\u00f3w w pomocy.</p>\
							</form>
ADS1115ModuleExplanations_Text2 =  <form>\
								<p>Ta tabela pokazuje parametry ka\u017cdego kana\u0142u tego modu\u0142u wej\u015b\u0107 analogowych ADS1115.<br/>Informacje o niekt\u00f3rych z tych parametr\u00f3w znajdziesz na stronach zmiennych i modu\u0142u wej\u015b\u0107 analogowych.<br/>Pozosta\u0142y parametr obja\u015bniono poni\u017cej :</p>\
								<li><b>Wzmocnienie</b> : wyb\u00f3r wzmocnienia PGA. Jedna z warto\u015bci 0,1,2,4,8 lub 16.</li>\
								<p>0 daje rzeczywiste wzmocnienie 2/3 z dok\u0142adno\u015bci\u0105 0.1875mV i zakresem [0-5]V przy 5VCC lub [0-3.3]V przy 3.3VCC<br/>\
								1 daje rzeczywiste wzmocnienie 1 z dok\u0142adno\u015bci\u0105 0.125mV i zakresem [0-4.096]V przy 5VCC lub [0-3.3]V przy 3.3VCC<br/>\
								2 daje rzeczywiste wzmocnienie 2 z dok\u0142adno\u015bci\u0105 0.0625mV i zakresem [0-2.048]V przy 5VCC lub 3.3VCC<br/>\
								4 daje rzeczywiste wzmocnienie 4 z dok\u0142adno\u015bci\u0105 0.03125mV i zakresem [0-1.0248]V przy 5VCC lub 3.3VCC<br/>\
								8 daje rzeczywiste wzmocnienie 8 z dok\u0142adno\u015bci\u0105 0.015625mV i zakresem [0-0.512]V przy 5VCC lub 3.3VCC<br/>\
								16 daje rzeczywiste wzmocnienie 16 z dok\u0142adno\u015bci\u0105 0.0078125mV i zakresem [0-0.256]V przy 5VCC lub 3.3VCC</p>\
							</form>
Gain_Tooltip = Wzmocnienie (patrz wy\u017cej)
Gain_Label = Wzmocnienie

