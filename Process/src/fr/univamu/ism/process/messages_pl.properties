IfBlockWithoutTrueBranch = W segmencie {0} => blok IF bez ga\u0142\u0119zi "prawda" : "{1}"
IfBlockWithoutFalseBranch = W segmencie {0} => blok IF bez ga\u0142\u0119zi "fa\u0142sz" : "{1}"
DoBlockWithoutEndFunction = W segmencie {0} => blok DO bez funkcji ko\u0144cowej.\n---> Utw\u00f3rz po\u0142\u0105czenie mi\u0119dzy funkcj\u0105 ko\u0144cow\u0105 a tym blokiem DO.\n---> Nast\u0119pnie kliknij dwukrotnie to po\u0142\u0105czenie, aby wskaza\u0107 funkcj\u0119 ko\u0144cow\u0105 tego bloku DO.
DoBlockWithoutStartFunction = W segmencie {0} => blok DO bez funkcji pocz\u0105tkowej.\n---> Utw\u00f3rz po\u0142\u0105czenie mi\u0119dzy tym blokiem DO a jego nast\u0119pn\u0105 funkcj\u0105.
SeveralStartBlocks = W segmencie {0} => kilka blok\u00f3w pocz\u0105tkowych : u\u017cywany jest tylko "{1}", {2} pomini\u0119to.\n---> Po\u0142\u0105cz te bloki tak, aby ten segment mia\u0142 tylko jeden blok pocz\u0105tkowy.
BranchLeavesConditionalBlock = W segmencie {0} => blok "{1}" ko\u0144czy blok IF "{2}", ale jest te\u017c osi\u0105gany z zagnie\u017cd\u017conego bloku "{3}" : ga\u0142\u0105\u017a opuszcza sw\u00f3j blok, wygenerowany kod jest b\u0142\u0119dny.\n---> Zduplikuj wsp\u00f3\u0142dzielone bloki tak, aby ka\u017cda ga\u0142\u0105\u017a ko\u0144czy\u0142a si\u0119 na ko\u0144cu w\u0142asnego bloku IF.
BranchLeavesDoBLock = W segmencie {0} => blok "{1}" ko\u0144czy p\u0119tl\u0119 DO "{2}", ale jest te\u017c osi\u0105gany z zagnie\u017cd\u017conego bloku "{3}" : ga\u0142\u0105\u017a opuszcza p\u0119tl\u0119 lub p\u0119tle si\u0119 nak\u0142adaj\u0105, wygenerowany kod jest b\u0142\u0119dny.\n---> Ka\u017cda ga\u0142\u0105\u017a musi dochodzi\u0107 do ko\u0144ca swojej p\u0119tli, a p\u0119tla zagnie\u017cd\u017cona musi ko\u0144czy\u0107 si\u0119 przed ko\u0144cem p\u0119tli zewn\u0119trznej.
BlockGeneratedSeveralTimes = W segmencie {0} => blok "{1}" jest generowany kilka razy : ga\u0142\u0119zie \u0142\u0105cz\u0105 si\u0119 w bloku poza swoim blokiem IF lub DO, wygenerowany kod jest b\u0142\u0119dny.\n---> Zduplikuj wsp\u00f3\u0142dzielone bloki tak, aby ka\u017cda ga\u0142\u0105\u017a ko\u0144czy\u0142a si\u0119 na ko\u0144cu w\u0142asnego bloku.
ExecutedEachLoop = P\u0119tla zdarze\u0144, p\u0119tla czasu rzeczywistego, wykonywana w ka\u017cdym cyklu
ExecutedOneTimeAfter = Wykonywany jednokrotnie po ostatniej p\u0119tli zdarze\u0144
ExecutedOneTimeBefore = Wykonywany jednokrotnie przed p\u0119tl\u0105 zdarze\u0144
