IfBlockWithoutTrueBranch = Dans le segment {0} => IF Block sans branche "true" : "{1}"
IfBlockWithoutFalseBranch = Dans le segment {0} => IF Block sans branche "false" : "{1}"
DoBlockWithoutEndFunction = Dans le segment {0}  => DO Block sans fonction de terminaison.\n---> Créez un lien entre la fonction de terminaison et ce block DO.\n---> Puis double cliquez sur ce lien pour spécifier la fonction de terminaison de ce block.
DoBlockWithoutStartFunction = Dans le segment {0}  => DO Block sans fonction de démarrage.\n--->  Créez un lien entre ce block DO et sa fonction de démarrage.
SeveralStartBlocks = Dans le segment {0} => plusieurs blocs de départ : seul "{1}" est utilisé, {2} ignoré(s).\n---> Reliez ces blocs pour obtenir un seul bloc de départ dans ce segment.
BranchLeavesConditionalBlock = Dans le segment {0} => le bloc "{1}" termine le bloc IF "{2}" mais il est aussi atteint depuis le bloc imbriqué "{3}" : une branche sort de son bloc, le code généré est incorrect.\n---> Dupliquez les blocs partagés pour que chaque branche se termine à la fin de son propre bloc IF.
BranchLeavesDoBLock = Dans le segment {0} => le bloc "{1}" termine la boucle DO "{2}" mais il est aussi atteint depuis le bloc imbriqué "{3}" : une branche sort de la boucle ou des boucles se croisent, le code généré est incorrect.\n---> Chaque branche doit rejoindre la fin de sa boucle, et une boucle imbriquée doit se terminer avant la fin de la boucle qui la contient.
BlockGeneratedSeveralTimes = Dans le segment {0} => le bloc "{1}" est généré plusieurs fois : des branches rejoignent un bloc situé hors de leur bloc IF ou DO, le code généré est incorrect.\n---> Dupliquez les blocs partagés pour que chaque branche se termine à la fin de son propre bloc.
ExecutedEachLoop = Event loop, boucle temps réel, code exécuté à chaque bloucle
ExecutedOneTimeAfter = Code exécuté une seule fois en fin de boucle temps réel
ExecutedOneTimeBefore = Code exécuté une seule fois en début de boucle temps réel
